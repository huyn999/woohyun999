name: fp_c_broker
# AUTO-GENERATED failprobe workload — IPC 브로커: 내부 채널 + UNIX listen + 이벤트 루프
# features: socketpair,unix_listen,epoll
# expected risks: socketpair:low; unix_listen:medium — bind 경로 재생성; epoll:low
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_socketpair_l01, f_socketpair, f_unix_listen_l01, f_unix_listen_l02, f_unix_listen_l03, f_unix_listen_l04, f_unix_listen_l05, f_unix_listen_l06, f_unix_listen, f_epoll_l01, f_epoll_l02, f_epoll_l03, f_epoll_l04, f_epoll, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
