name: fp_p16_lock_posix__logfile
# AUTO-GENERATED failprobe workload — pair probe: fcntl POSIX 레코드 락 보유 (DB 파일 락) + append 로그 파일 fd (모든 서비스 데몬)
# features: lock_posix,logfile
# expected risks: lock_posix:HIGH — --file-locks 필요; logfile:low — regular file fd
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_lock_posix_l01, f_lock_posix_l02, f_lock_posix_l03, f_lock_posix, f_logfile_l01, f_logfile_l02, f_logfile, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
