name: fp_p11_lock_flock__eventfd
# AUTO-GENERATED failprobe workload — pair probe: flock 배타 락 보유 (단일 인스턴스 락파일) + eventfd (이벤트 루프 wakeup)
# features: lock_flock,eventfd
# expected risks: lock_flock:HIGH — 기본 옵션 dump 거부 예상 (--file-locks 필요); eventfd:low
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_lock_flock_l01, f_lock_flock_l02, f_lock_flock, f_eventfd, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
