name: fp_w_wam_renderer
# AUTO-GENERATED failprobe workload — [P] webOS-faithful: WAM 웹앱 렌더러 — Chromium 멀티프로세스 1개: V8 JIT + 300MB 힙 + 스레드풀 + 버스
# features: mmap_exec_jit,large_heap,thread4,unix_conn,memfd
# expected risks: mmap_exec_jit:HIGH — exec 페이지 복원; large_heap:none — dump 이미지만 커짐; thread4:low; unix_conn:medium — established unix; memfd:low (CRIU 4.x 지원)
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_mmap_exec_jit, f_large_heap_l01, f_large_heap_l02, f_large_heap, f_thread4, f_unix_conn_l01, f_unix_conn_l02, f_unix_conn_l03, f_unix_conn_l04, f_unix_conn_l05, f_unix_conn, f_memfd_l01, f_memfd_l02, f_memfd_l03, f_memfd_l04, f_memfd_l05, f_memfd, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 334
