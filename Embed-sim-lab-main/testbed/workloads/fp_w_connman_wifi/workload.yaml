name: fp_w_connman_wifi
# AUTO-GENERATED failprobe workload — [P] webOS-faithful: 네트워크 매니저(connman/wpa 대응) — NETLINK_ROUTE 구독 + 버스
# features: netlink,unix_listen,epoll
# expected risks: netlink:HIGH — netlink 복원 제한; unix_listen:medium — bind 경로 재생성; epoll:low
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_netlink_l01, f_netlink_l02, f_netlink_l03, f_netlink_l04, f_netlink_l05, f_netlink, f_unix_listen_l01, f_unix_listen_l02, f_unix_listen_l03, f_unix_listen_l04, f_unix_listen_l05, f_unix_listen_l06, f_unix_listen, f_epoll_l01, f_epoll_l02, f_epoll_l03, f_epoll_l04, f_epoll, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
