name: fp_w_bluetooth_mgr
# AUTO-GENERATED failprobe workload — [P] webOS-faithful: 블루투스 매니저 — netlink + 워커 + 이벤트
# features: netlink,thread1,eventfd,unix_conn
# expected risks: netlink:HIGH — netlink 복원 제한; thread1:low; eventfd:low; unix_conn:medium — established unix
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_netlink_l01, f_netlink_l02, f_netlink_l03, f_netlink_l04, f_netlink_l05, f_netlink, f_thread1, f_eventfd, f_unix_conn_l01, f_unix_conn_l02, f_unix_conn_l03, f_unix_conn_l04, f_unix_conn_l05, f_unix_conn, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
