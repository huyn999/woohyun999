name: dirty
params:
  bytes:       {default: 52428800}
  dirty_bytes: {default: 1048576}
  interval_ms: {default: 200}
  port:        {default: 18080}   # config 경로는 명시 포트 필수 (0은 config_to_env가 거부)
phases: [ready, served_first, steady]
metrics: [checksum]
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 2
