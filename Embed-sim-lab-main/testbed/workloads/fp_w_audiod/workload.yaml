name: fp_w_audiod
# AUTO-GENERATED failprobe workload — [P] webOS-faithful: 오디오 데몬 — POSIX shm 버퍼(현대 스택 방식: SysV 아님) + 주기 믹서 + 버스
# features: shm_posix,timerfd,thread1,unix_listen
# expected risks: shm_posix:medium; timerfd:low; thread1:low; unix_listen:medium — bind 경로 재생성
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_shm_posix_l01, f_shm_posix_l02, f_shm_posix_l03, f_shm_posix_l04, f_shm_posix_l05, f_shm_posix_l06, f_shm_posix_l07, f_shm_posix, f_timerfd_l01, f_timerfd_l02, f_timerfd_l03, f_timerfd_l04, f_timerfd, f_thread1, f_unix_listen_l01, f_unix_listen_l02, f_unix_listen_l03, f_unix_listen_l04, f_unix_listen_l05, f_unix_listen_l06, f_unix_listen, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 24
