name: fp_c_watchdog
# AUTO-GENERATED failprobe workload — 워치독: 주기 SIGALRM + signalfd + 로그
# features: itimer,signalfd,logfile
# expected risks: itimer:medium — 진행 중 타이머+핸들러; signalfd:low; logfile:low — regular file fd
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_itimer_l01, f_itimer_l02, f_itimer_l03, f_itimer, f_signalfd_l01, f_signalfd_l02, f_signalfd, f_logfile_l01, f_logfile_l02, f_logfile, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
