# features: lock_flock,timerfd
# expected risks: lock_flock:HIGH — 기본 옵션 dump 거부 예상 (--file-locks 필요); timerfd:low
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_lock_flock_l01, f_lock_flock_l02, f_lock_flock, f_timerfd_l01, f_timerfd_l02, f_timerfd_l03, f_timerfd_l04, f_timerfd, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
