phases: [init, base_mem, f_lock_flock_l01, f_lock_flock_l02, f_lock_flock, f_thread1, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
