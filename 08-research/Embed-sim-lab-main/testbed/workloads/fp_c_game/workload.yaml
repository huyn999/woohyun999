name: fp_c_game
# AUTO-GENERATED failprobe workload — 네이티브 게임: 대형 힙 + 스레드풀 + 유휴 워커(futex)
# features: large_heap,thread4,futex_wait
# expected risks: large_heap:none — dump 이미지만 커짐; thread4:low; futex_wait:medium — 블록 상태 복원
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_large_heap_l01, f_large_heap_l02, f_large_heap, f_thread4, f_futex_wait, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 316
