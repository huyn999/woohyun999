name: fp_c_settings
# AUTO-GENERATED failprobe workload — 설정 서비스: 메시지 큐 + 레거시 세마포어 + 로그
# features: mq,sem_sysv,logfile
# expected risks: mq:medium; sem_sysv:medium; logfile:low — regular file fd
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_mq_l01, f_mq_l02, f_mq_l03, f_mq_l04, f_mq_l05, f_mq, f_sem_sysv_l01, f_sem_sysv_l02, f_sem_sysv, f_logfile_l01, f_logfile_l02, f_logfile, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
