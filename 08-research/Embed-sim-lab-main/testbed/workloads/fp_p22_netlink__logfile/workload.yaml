name: fp_p22_netlink__logfile
# AUTO-GENERATED failprobe workload — pair probe: NETLINK_ROUTE 소켓 (네트워크 상태 감시) + append 로그 파일 fd (모든 서비스 데몬)
# features: netlink,logfile
# expected risks: netlink:HIGH — netlink 복원 제한; logfile:low — regular file fd
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_netlink_l01, f_netlink_l02, f_netlink_l03, f_netlink_l04, f_netlink_l05, f_netlink, f_logfile_l01, f_logfile_l02, f_logfile, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
