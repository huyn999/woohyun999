name: fp_w_settings_svc
# AUTO-GENERATED failprobe workload — [P] webOS-faithful: settingsservice — 수신 버스 + 설정 파일 레코드락 + 로그 (mq 없는 실제 설계)
# features: unix_listen,epoll,lock_posix,logfile
# expected risks: unix_listen:medium — bind 경로 재생성; epoll:low; lock_posix:HIGH — --file-locks 필요; logfile:low — regular file fd
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_unix_listen_l01, f_unix_listen_l02, f_unix_listen_l03, f_unix_listen_l04, f_unix_listen_l05, f_unix_listen_l06, f_unix_listen, f_epoll_l01, f_epoll_l02, f_epoll_l03, f_epoll_l04, f_epoll, f_lock_posix_l01, f_lock_posix_l02, f_lock_posix_l03, f_lock_posix, f_logfile_l01, f_logfile_l02, f_logfile, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
