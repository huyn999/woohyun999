name: fp_p17_lock_posix__eventfd
# AUTO-GENERATED failprobe workload — pair probe: fcntl POSIX 레코드 락 보유 (DB 파일 락) + eventfd (이벤트 루프 wakeup)
# features: lock_posix,eventfd
# expected risks: lock_posix:HIGH — --file-locks 필요; eventfd:low
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_lock_posix_l01, f_lock_posix_l02, f_lock_posix_l03, f_lock_posix, f_eventfd, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
