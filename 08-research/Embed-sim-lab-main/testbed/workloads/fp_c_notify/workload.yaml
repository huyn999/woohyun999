name: fp_c_notify
# AUTO-GENERATED failprobe workload — 알림 서비스: 이벤트 fd + 타이머 + 버스 연결
# features: eventfd,timerfd,unix_conn
# expected risks: eventfd:low; timerfd:low; unix_conn:medium — established unix
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_eventfd, f_timerfd_l01, f_timerfd_l02, f_timerfd_l03, f_timerfd_l04, f_timerfd, f_unix_conn_l01, f_unix_conn_l02, f_unix_conn_l03, f_unix_conn_l04, f_unix_conn_l05, f_unix_conn, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
