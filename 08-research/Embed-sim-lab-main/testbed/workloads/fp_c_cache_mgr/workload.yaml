name: fp_c_cache_mgr
# AUTO-GENERATED failprobe workload — 캐시 매니저: ghost 파일 + 감시 + 공유메모리
# features: tmpunlink,inotify,shm_posix
# expected risks: tmpunlink:medium — ghost file 복원 경로; inotify:medium — watch 경로 복원; shm_posix:medium
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_tmpunlink_l01, f_tmpunlink_l02, f_tmpunlink_l03, f_tmpunlink, f_inotify_l01, f_inotify_l02, f_inotify_l03, f_inotify_l04, f_inotify, f_shm_posix_l01, f_shm_posix_l02, f_shm_posix_l03, f_shm_posix_l04, f_shm_posix_l05, f_shm_posix_l06, f_shm_posix_l07, f_shm_posix, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 24
