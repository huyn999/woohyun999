name: fp_w_memorymanager
# AUTO-GENERATED failprobe workload — [P] webOS-faithful: memorymanager — 주기 샘플링 + 이벤트 통지 + 수신 버스
# features: unix_listen,timerfd,eventfd,logfile
# expected risks: unix_listen:medium — bind 경로 재생성; timerfd:low; eventfd:low; logfile:low — regular file fd
params:
  bytes: {default: 52428800}
  port:  {default: 18080}
  phase_gap_ms: {default: 400}   # phase별 정지 창(호환성 스윕용); 시간 측정 시 0
phases: [init, base_mem, f_unix_listen_l01, f_unix_listen_l02, f_unix_listen_l03, f_unix_listen_l04, f_unix_listen_l05, f_unix_listen_l06, f_unix_listen, f_timerfd_l01, f_timerfd_l02, f_timerfd_l03, f_timerfd_l04, f_timerfd, f_eventfd, f_logfile_l01, f_logfile_l02, f_logfile, ready, served_first, steady]
metrics: []
resident:
  from_param: bytes
  bytes_per_unit: 1
  overhead_mib: 8
